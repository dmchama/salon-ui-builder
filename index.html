<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback title only: every route renders its own <Seo> (react-helmet-async), which
         overwrites this on mount. Meta description/OG/Twitter tags are intentionally NOT
         duplicated here — react-helmet-async only dedupes tags it rendered itself, so a static
         meta tag here would sit alongside (not replace) the per-page one. Every route must render
         <Seo> so those tags are never missing. -->
    <title>SaloonBooking</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
</head>

  </body>
</html>
